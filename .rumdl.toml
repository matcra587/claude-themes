# rumdl configuration

[global]
flavor = "gfm"
respect_gitignore = true

# GFM renders prose paragraphs without hard wrapping; source line length
# is cosmetic. Disable the line-length rule.
disable = ["MD013"]

# .claude holds Claude-facing instructions, not project docs.
exclude = [".claude"]

# Collapsible sections in the contributing guide use GFM's supported
# HTML subset; nothing else is allowed through.
[MD033]
allowed-elements = ["details", "summary", "strong"]
