["test:licenses"]
description = "Test licence policy and packaged notices"
run = "node --test .github/actions/validate-licenses/tests/licenses.test.mjs"

["test:sources"]
description = "Test upstream source integrity and selection"
run = "node --test .github/actions/validate-licenses/tests/sources.test.mjs"

["test:preview-actions"]
description = "Test preview planning, generation and publishing"
run = "node --test .github/actions/plan-previews/tests/*.test.mjs .github/actions/render-previews/tests/*.test.mjs .github/actions/commit-previews/tests/*.test.mjs"

["test:update-previews"]
description = "Test preview bundle validation and scoped gallery updates"
run = "node --test .github/actions/update-previews/tests/*.test.mjs"

["test:versions"]
description = "Test automatic plugin version updates"
run = "node --test .github/actions/version-themes/tests/*.test.mjs"
