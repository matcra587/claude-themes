---
name: Theme proposal
description: Propose a new theme family before building it
title: "[proposal]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Read [What's welcome](https://github.com/matcra587/claude-themes/blob/main/CONTRIBUTING.md#whats-welcome)
        in the contributing guide before proposing a theme. It explains what gets
        declined and why proposals come before pull requests.
  - type: input
    id: family
    attributes:
      label: Palette family
      description: e.g. Kanagawa, Ayu
    validations:
      required: true
  - type: input
    id: upstream
    attributes:
      label: Canonical upstream
      description: Link the official palette definition at a specific commit or versioned release.
      placeholder: https://github.com/OWNER/REPOSITORY/blob/COMMIT/path/to/palette
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: Upstream licence
      description: Link the official upstream licence at the same revision as the palette. If none is published, say so.
      placeholder: https://github.com/OWNER/REPOSITORY/blob/COMMIT/LICENSE
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Unclear terms
      description: Mention any extra restrictions or anything you are unsure about. Leave blank if none.
    validations:
      required: false
  - type: textarea
    id: plan
    attributes:
      label: Planned variants
      description: Dark/light flavours, ANSI siblings, anything unusual about the palette (no orange, no violet, ...).
    validations:
      required: false
  - type: checkboxes
    id: welcome
    attributes:
      label: Pre-flight
      options:
        - label: I read *What's welcome* and this palette has a clear canonical upstream (not ad-hoc, not Base16)
          required: true
