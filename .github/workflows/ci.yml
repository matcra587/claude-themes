---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

# Pull requests cancel superseded runs per ref; pushes to main get one group
# per commit so a rapid series of pushes never cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  schema-validation:
    name: Theme schema validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # changed-file listing + result comment upsert on PRs
    steps:
      - name: Checkout
        # clover: provider=auto constraint=minor tags=checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate theme files
        uses: ./.github/actions/schema-validation

  md-lint:
    name: Markdown lint
    # clover: provider=auto tags=actions
    uses: matcra587/github-actions/.github/workflows/md-lint.yml@67f0de0d0ceebe69895e868207c04e5c66b3bde8
    permissions:
      contents: read
